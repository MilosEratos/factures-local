<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factures Local</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Factures <span class="local">· 100 % local</span></h1>
<p class="muted" id="counterInfo"></p>
<div class="layout">
<div class="main">
<div class="card">
  <div class="row">
    <label>Numéro<input id="number" class="inp" inputmode="numeric"></label>
    <label>Date<input id="date" class="inp" placeholder="JJ/MM/AAAA"></label>
  </div>
  <label>Client<input id="client" class="inp" list="clients" placeholder="Nom du client"><datalist id="clients"></datalist></label>
  <label>Adresse client (une ligne par ligne)<textarea id="addr" class="inp" rows="2" placeholder="12 rue des Exemples&#10;75001 Paris"></textarea></label>
  <label>Titre de la prestation (1re ligne en gras, une ligne par ligne)<textarea id="title" class="inp" rows="2" placeholder="Modélisation 3D&#10;PROJET EXEMPLE"></textarea></label>
  <div id="lines"></div>
  <button id="addLine" class="btn">+ Ajouter une ligne</button>
  <div class="row actions">
    <button id="gen" class="btn primary">Générer la facture</button>
  </div>
  <div id="status" class="muted"></div>
</div>
<div id="result" class="card hidden">
  <img id="preview" alt="Aperçu de la facture">
  <div class="row actions">
    <button id="dl" class="btn primary">Télécharger le PDF</button>
  </div>
</div>
<h2>Historique</h2>
<div id="history"></div>
</div>
<aside class="chat">
  <h2>Assistant <span class="local">· IA locale</span></h2>
  <textarea id="chatInput" class="inp" rows="4" placeholder="Ex : le client s'appelle Monsieur X, 3 jours de graphisme à 500€/jour, plus 35 € de taxi de retour"></textarea>
  <div class="row actions">
    <button id="chatFill" class="btn primary">Remplir le formulaire</button>
  </div>
  <p class="muted small" id="chatStatus"></p>
  <div id="chatMsgs" class="msgs"></div>
</aside>
</div>
<script src="/static/app.js"></script>
</body>
</html>
